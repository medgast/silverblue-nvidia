name: Generate Cosign Key Pair

on:
  workflow_dispatch: # Ermöglicht das manuelle Starten per Klick

jobs:
  generate-key:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0 # Installiert Cosign ohne manuelle Abhängigkeiten

      - name: Generate Key Pair
        run: |
          # Generiert den Schlüssel ohne Passwort-Abfrage
          cosign generate-key-pair
        env:
          COSIGN_PASSWORD: "" # Erzwingt ein leeres Passwort

      - name: Output Keys
        run: |
          echo "=== KOPIERE DIESEN INHALT FÜR DEN REPOSITORY SECRET (SIGNING_SECRET) ==="
          cat cosign.key
          echo "========================================================================"
          echo ""
          echo "=== KOPIERE DIESEN INHALT FÜR DEINE cosign.pub DATEI ==="
          cat cosign.pub
          echo "========================================================================"
