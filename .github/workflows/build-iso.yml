name: Generate ISO Manually

on:
  workflow_dispatch: # Ermöglicht den manuellen Start per Klick

env:
  IMAGE_NAME: "vanilla-nvidia" # <- Passe dies exakt an den kleingeschriebenen Namen aus deiner recipe.yml an!
  IMAGE_TAG: "latest"

jobs:
  build-iso:
    name: Generate ISO
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Dieser Schritt wandelt deinen Benutzernamen (z.B. Medgast) in reine Kleinbuchstaben um
      - name: Lowercase Repository Owner
        id: registry_case
        run: |
          echo "owner_lowercase=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: "${{ github.repository_owner }}"

      - name: Build ISO using UBlue Isogenerator
        uses: ublue-os/isogenerator@main
        with:
          image-repository: "ghcr.io/${{ steps.registry_case.outputs.owner_lowercase }}"
          image-name: ${{ env.IMAGE_NAME }}
          image-tag: ${{ env.IMAGE_TAG }}

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}-iso
          path: |
            build/*.iso
            build/*.iso.sha256
          if-no-files-found: error
          retention-days: 5
