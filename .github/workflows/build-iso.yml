name: Generate ISO Manually

on:
  workflow_dispatch: # Ermöglicht den manuellen Start per Klick

env:
  IMAGE_NAME: "vanilla-nvidia" # <- Passe dies exakt an den kleingeschriebenen Namen aus deiner recipe.yml an!
  IMAGE_TAG: "latest"

jobs:
  build-iso:
    name: Generate ISO
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Wandelt deinen Benutzernamen (z.B. Medgast) in reine Kleinbuchstaben um
      - name: Lowercase Repository Owner
        id: registry_case
        run: |
          echo "owner_lowercase=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: "${{ github.repository_owner }}"

      # Installiert das BlueBuild-CLI nativ über Podman auf dem Runner
      - name: Install BlueBuild CLI
        run: |
          podman run --pull always --rm ghcr.io/blue-build/cli:latest-installer | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Generiert das ISO mit der korrekten CLI-Syntax und Root-Rechten
      - name: Build ISO via BlueBuild
        run: |
          sudo env "PATH=$PATH" bluebuild generate-iso \
            --iso-name "${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.iso" \
            image "ghcr.io/${{ steps.registry_case.outputs.owner_lowercase }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      # Lädt das fertige ISO als Download-Artefakt hoch
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}-iso
          path: |
            *.iso
            *.iso.sha256
          if-no-files-found: error
          retention-days: 5
