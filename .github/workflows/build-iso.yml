name: Generate ISO Manually

on:
  workflow_dispatch: # Ermöglicht den manuellen Start per Klick

env:
  IMAGE_NAME: "vanilla-nvidia" # <- Passe dies exakt an den kleingeschriebenen Namen aus deiner recipe.yml an!
  IMAGE_TAG: "latest"

jobs:
  build-iso:
    name: Generate ISO
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
      options: --privileged # Zwingend erforderlich für Loop-Devices beim ISO-Bau
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Wandelt deinen Benutzernamen (z.B. Medgast) in reine Kleinbuchstaben um
      - name: Lowercase Repository Owner
        id: registry_case
        run: |
          echo "owner_lowercase=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: "${{ github.repository_owner }}"

      # Nutzt das in Fedora eingebaute Podman für den Login anstelle der Docker Action
      - name: Log in to GitHub Container Registry via Podman
        run: |
          podman login ghcr.io -u ${{ github.actor }} -p ${{ github.token }}

      # Baut das ISO
      - name: Build ISO using UBlue Isogenerator
        uses: ublue-os/isogenerator@main
        with:
          IMAGE_REPO: "ghcr.io/${{ steps.registry_case.outputs.owner_lowercase }}"
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}

      # Lädt das fertige ISO als Download-Artefakt hoch
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}-iso
          path: |
            build/*.iso
            build/*.iso.sha256
          if-no-files-found: error
          retention-days: 5
