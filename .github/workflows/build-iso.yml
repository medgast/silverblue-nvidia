name: Generate ISO Manually

on:
  workflow_dispatch: # Ermöglicht den manuellen Start per Klick

env:
  IMAGE_NAME: "vanilla-nvidia" # <- Passe dies exakt an den kleingeschriebenen Namen aus deiner recipe.yml an!
  IMAGE_TAG: "latest"

jobs:
  build-iso:
    name: Generate ISO
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Nutzt den offiziellen ublue-os ISO-Generator
      - name: Build ISO using UBlue Isogenerator
        uses: ublue-os/isogenerator@main
        with:
          image-repository: "ghcr.io/${{ github.repository_owner }}"
          image-name: ${{ env.IMAGE_NAME }}
          image-tag: ${{ env.IMAGE_TAG }}

      # Lädt das fertige ISO als Download-Artefakt hoch
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}-iso
          path: |
            build/*.iso
            build/*.iso.sha256
          if-no-files-found: error
          retention-days: 5
